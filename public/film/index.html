<body class="film-page">

  <header class="nav dark-nav" style="padding: clamp(16px,3vw,28px) var(--gutter);">
    <span>WORK</span>
    <div class="nav-links">
      <a href="/writing">WRITING</a>
      <a href="/about">INFO</a>
    </div>
  </header>

  <section class="home-hero" aria-label="Selected work — cycling project stills">
    <div class="home-hero-slide is-active" data-still="if not later, when?">
      <img src="../images/if-not-later-when/stack-03.webp" alt="if not later, when? — a boy sitting on a bench" fetchpriority="high">
    </div>
    <div class="home-hero-slide" aria-hidden="true" data-still="project unsanctioned">
      <img src="../images/unsanctioned/website-hero.webp" alt="Project Unsanctioned — hero" loading="eager">
    </div>
    <div class="hero-overlay">
      <p class="mono">PJ KIM — FILMMAKER / CREATIVE TECHNOLOGIST <span class="hero-still-sep" aria-hidden="true">·</span> <span class="hero-still-label">if not later, when?</span></p>
      <h1 class="disp">SELECTED WORK</h1>
    </div>
  </section>

  <section class="section dark-section" style="padding: clamp(32px,6vw,72px) 0;">
    <div class="projects">
      <a class="project" href="/if-not-later-when"
         data-type="FILM"
         data-client="self"
         data-status="RELEASED"
         data-year="2026">
        <img src="../images/if-not-later-when/hero.webp" alt="Two figures at sunset in a field" loading="lazy">
        <div class="project-overlay">
          <h2 class="disp">IF NOT LATER, WHEN?</h2>
          <div data-project-meta></div>
        </div>
      </a>
      <a class="project" href="/unsanctioned"
         data-type="EVENT,PROMO,FILM"
         data-client="self"
         data-status="RELEASED"
         data-year="2026">
        <img src="../images/unsanctioned/chad-tiffany-close.webp" alt="Project Unsanctioned" loading="lazy">
        <div class="project-overlay">
          <h2 class="disp">PROJECT UNSANCTIONED</h2>
          <div data-project-meta></div>
        </div>
      </a>
    </div>
  </section>

  <footer class="monogram">
    <a href="/inspo">INSPO</a> · PJK1M
  </footer>

  <script src="../film/projects.js"></script>
  <script>
    // Cycle the Selected Work hero between project stills. Each slide is a
    // full-bleed cover image inside the same hero, so every still scrolls
    // with the page exactly like the original unsanctioned hero. The still
    // label above SELECTED WORK follows the active slide.
    (function () {
      var hero = document.querySelector(".home-hero");
      if (!hero) return;
      var slides = Array.prototype.slice.call(hero.querySelectorAll(".home-hero-slide"));
      if (slides.length < 2) return;
      var label = hero.querySelector(".hero-still-label");
      var active = 0;
      function show(i) {
        slides[active].classList.remove("is-active");
        slides[active].setAttribute("aria-hidden", "true");
        active = (i + slides.length) % slides.length;
        slides[active].classList.add("is-active");
        slides[active].removeAttribute("aria-hidden");
        if (label) label.textContent = slides[active].getAttribute("data-still") || "";
      }
      setInterval(function () { show(active + 1); }, 6000);
    })();
  </script>
</body>
